# The Flatpak of xl-Calculator. To build and install it from this folder:
#   flatpak-builder --user --install --force-clean build-dir flatpak/io.github.xlcheese.XlCalculator.yml
# Flathub builds from its own copy of this file, which takes the source from a release tag instead
# of the folder (see the last module).
id: io.github.xlcheese.XlCalculator
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: xl-calculator
# the translations (about 340 kB in all) stay in the app rather than in a separate language pack, so a
# single-file bundle has them too
separate-locales: false
finish-args:
  - --share=ipc
  # X11 only: the Buffet menu places its own pop-ups, which Wayland doesn't allow, so on a Wayland
  # desktop xl-Calculator runs through XWayland
  - --socket=x11
  # the exchange rates
  - --share=network
cleanup:
  # the background refresh timer: a Flatpak can't install systemd units, and Preferences greys
  # that setting out when the timer isn't there
  - /lib/systemd
modules:
  # up to 50 decimal places (without it, 15)
  - name: python3-mpmath
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} mpmath --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/43/e3/7d92a15f894aa0c9c4b49b8ee9ac9850d6e63b03c9c32c0367a13ae62209/mpmath-1.3.0-py3-none-any.whl
        sha256: a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c

  - name: xl-calculator
    buildsystem: simple
    build-commands:
      - make install PREFIX=${FLATPAK_DEST}
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .preview
          - build-dir
          - .flatpak-builder
